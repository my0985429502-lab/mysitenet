<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Управление рекламой</title>
<link rel="stylesheet" href="ads.css">
</head>
<body>

<div class="container">

<h1>Администрация рекламы</h1>

<div id="loginBox">

<h2>Вход администратора</h2>

<form id="loginForm">

<input id="email"
type="email"
placeholder="Email"
required>

<input id="password"
type="password"
placeholder="Пароль"
required>

<button type="submit">Войти</button>

</form>

</div>

<div id="adminPanel" hidden>

<h2>Рекламные заявки</h2>

<button id="refreshAds">Обновить</button>
<button id="logout">Выйти</button>

<div id="adminAds"></div>

</div>

<p id="adminMessage"></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./ads.js"></script>

</body>
</html>
