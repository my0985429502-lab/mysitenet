<body><!DOCTYPE html>
<html>
<body>

<h2>Сам себе майнинг (Demo WASM)</h2>
<p>Нажал → CPU считает → очки растут</p>
<button onclick="start()">Старт</button>
<button onclick="stop()">Стоп</button>
<p id="out">Очки: 0</p>

<script>
// очки и флаг запуска
let run = false;
let score = 0;
let add;

// встроенный WASM бинарь (тот же self.wasm)
const wasmBytes = new Uint8Array([
  0,97,115,109,1,0,0,0,1,6,1,96,2,127,127,1,127,
  3,2,1,0,7,7,1,4,119,111,114,107,0,0,
  10,22,1,20,0,32,0,65,1,106,33,0,65,0,33,1,3,64,32,1,33,0,65,1,106,33,1,32,0,65,10,75,13,0,11,32,1,11
]);

// инициализация WASM
WebAssembly.instantiate(wasmBytes).then(obj => {
  add = obj.instance.exports;
  console.log("WASM готов ✅");
});

function start() {
  if (!add) {
    alert("WASM ещё не готов, подожди секунду");
    return;
  }
  run = true;
  loop();
}

function stop() {
  run = false;
}

function loop() {
  if (!run) return;
  add.work(2_000_000); // выполняем тяжелую работу
  score += 1;
  document.getElementById("out").innerText = "Очки: " + score;
  setTimeout(loop, 10);
}
</script>

</body>
</html>
<script></script>
</body>
</html>
