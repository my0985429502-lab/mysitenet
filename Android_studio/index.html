package com.example.httpsServer

import android.app.Activity
import android.content.Intent
import android.net.Uri
import android.os.Bundle
import androidx.appcompat.app.AppCompatActivity
import android.widget.Button
import android.widget.TextView
import fi.iki.elonen.NanoHTTPD
import java.io.InputStream

class MainActivity : AppCompatActivity() {

    private lateinit var server: WebServer
    private var folderUri: Uri? = null
    private val PICK_FOLDER = 1001

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_main)

        val textStatus = findViewById<TextView>(R.id.textStatus)
        val btnChoose = findViewById<Button>(R.id.btnChooseFolder)
        val btnStart = findViewById<Button>(R.id.btnStartServer)
        val btnStop = findViewById<Button>(R.id.btnStopServer)

        server = WebServer(this, 8080)

        btnChoose.setOnClickListener {
            val intent = Intent(Intent.ACTION_OPEN_DOCUMENT_TREE)
            startActivityForResult(intent, PICK_FOLDER)
        }

        btnStart.setOnClickListener {
            if (folderUri == null) {
                textStatus.text = "Оберіть папку сайту!"
            } else {
                server.setFolderUri(folderUri!!)
                server.start()
                textStatus.text = "Сервер запущено на http://localhost:8080"
            }
        }

        btnStop.setOnClickListener {
            server.stop()
            textStatus.text = "Сервер зупинено"
        }
    }

    override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
        super.onActivityResult(requestCode, resultCode, data)
        if (requestCode == PICK_FOLDER && resultCode == Activity.RESULT_OK) {
            folderUri = data?.data
        }
    }

    override fun onDestroy() {
        super.onDestroy()
        server.stop()
    }
}

class WebServer(private val activity: AppCompatActivity, port: Int) : NanoHTTPD(port) {

    private var folderUri: Uri? = null

    fun setFolderUri(uri: Uri) {
        folderUri = uri
    }

    override fun serve(session: IHTTPSession?): Response {
        if (folderUri == null) {
            return newFixedLengthResponse(Response.Status.INTERNAL_ERROR, "text/plain", "Папка сайту не вибрана")
        }
        try {
            val path = session?.uri ?: "/"
            val fileUri = Uri.withAppendedPath(folderUri, if (path == "/") "index.html" else path)
            val inputStream: InputStream? = activity.contentResolver.openInputStream(fileUri)
            if (inputStream == null) return newFixedLengthResponse(Response.Status.NOT_FOUND, "text/plain", "404 Not Found")
            val content = inputStream.bufferedReader().use { it.readText() }
            val mime = when {
                fileUri.path?.endsWith(".html") == true -> "text/html"
                fileUri.path?.endsWith(".css") == true -> "text/css"
                fileUri.path?.endsWith(".js") == true -> "application/javascript"
                else -> "text/plain"
            }
            return newFixedLengthResponse(Response.Status.OK, mime, content)
        } catch (e: Exception) {
            return newFixedLengthResponse(Response.Status.INTERNAL_ERROR, "text/plain", "500 Error")
        }
    }
}
</textarea>

<button id="generateZip">Згенерувати ZIP</button>

<script>
document.getElementById('generateZip').onclick = function() {
    const zip = new JSZip();
    const filenames = document.querySelectorAll('.filename');
    const contents = document.querySelectorAll('textarea');
    for(let i=0; i<filenames.length; i++){
        const name = filenames[i].value.trim();
        if(name) zip.file(name, contents[i].value);
    }
    zip.generateAsync({type:"blob"}).then(function(content) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(content);
        a.download = "HttpsServerProject.zip";
        a.click();
    });
};
</script>
