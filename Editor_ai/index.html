<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:Arial;margin:10px;}
canvas{border:1px solid #444;max-width:100%;touch-action:none;display:block;margin-bottom:8px;}
button{padding:6px 10px;margin:4px;}
.controls{border:1px solid #ccc;padding:10px;margin-top:10px;}
.controls-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.small{font-size:0.9rem;color:#333}</style>
</head>
<body><h2>Полный редактор изображения + рисование</h2>
<script>
const wrap=document.getElementById('canvasWrapper');
const hand=document.getElementById('handTool');
let pan=false,lx=0,ly=0;

hand.onclick=()=>{ 
  hand.classList.toggle('active'); 
};

// палец коснулся
wrap.addEventListener('touchstart',e=>{
 if(!hand.classList.contains('active')) return;
 if(e.touches.length!==1) return;

 pan=true;
 lx=e.touches[0].clientX;
 ly=e.touches[0].clientY;
 e.preventDefault();
},{passive:false});

// движение пальцем
wrap.addEventListener('touchmove',e=>{
 if(!pan) return;

 const t=e.touches[0];
 wrap.scrollLeft -= (t.clientX - lx);
 wrap.scrollTop  -= (t.clientY - ly);

 lx=t.clientX;
 ly=t.clientY;

 e.preventDefault();
},{passive:false});

// палец отпущен
wrap.addEventListener('touchend',()=>{ pan=false; });
</script>
<div class="controls-row">
  <input type="file" id="file" accept="image/*">
  <button id="saveImg">Сохранить</button>
<button id="handTool" type="button">🤚 Рука</button>




  
</div>
<div id="canvasWrapper" style="
  width:100%;
  height:80vh;
  overflow:auto;
  position:relative;">
<canvas id="c" width="800" height="600"></canvas></div>

<div id="layerControls" style="margin-top:10px;">
  <button id="addLayer">Добавить слой</button>
  <button id="delLayer">Удалить слой</button>
  <button id="layerUp">Вверх</button>
  <button id="layerDown">Вниз</button>
</div>
<div id="layersList" style="margin-top:8px;border:1px solid #ccc;padding:6px;"></div>


<div class="controls">
<h3>Рисование</h3>
<div class="controls-row">
  <button id="draw">Карандаш</button>
  <button id="erase">Ластик</button>
  <button id="rect">Прямоугольник</button>
  <button id="circle">Круг</button>
  <button id="arrow">Стрелка</button>
  <button id="text">Текст</button>
  <button id="off">Выключить</button>
</div>
<div class="controls-row" style="margin-top:6px">
  <button id="line">Линия</button>
  <button id="triangle">Треугольник</button>
  <button id="dblarrow">Двухсторонняя стрелка</button>
  <button id="soft">Мягкая кисть</button>
  <button id="spray">Аэрограф</button>
  <button id="fill">Заливка</button>
  <button id="crop">Crop</button>
  <button id="undo">Undo</button>
  <button id="redo">Redo</button>
</div>

<div style="margin-top:8px" class="small">
Толщина: <input id="size" type="range" min="1" max="80" value="5">
Цвет: <input id="color" type="color" value="#000000">
Текст: <input id="txt" type="text" style="width:40%">
</div>
</div>

<script>

function setMode(m){
  mode = m;
  trianglePoints = [];
  drawing = false;
  cropSelecting = false;
}

/* Unified drawing system with many tools and no name conflicts.
Triangle mode: 3 clicks/presses create a triangle (variant 2 requested).
Works with mouse and touch. */

const canvas = document.getElementById('c');

// --- Layers-aware helpers (injected) ---
function getActiveCanvas(){
  // layers array may be defined later; fall back to original canvas
  try{
    if(typeof layers !== 'undefined' && layers.length>0) return layers[activeLayer];
  }catch(e){}
  return canvas;
}
function getActiveCtx(){
  return getActiveCanvas().getContext('2d');
}
// merge all layers into a temporary canvas and return dataURL
function getMergedDataURL(){
  try{
    // if layers exist, draw them in order; otherwise use main canvas
    if(typeof layers !== 'undefined' && layers.length>0){
      const w = layers[0].width, h = layers[0].height;
      const tmp = document.createElement('canvas');
      tmp.width = w; tmp.height = h;
      const tctx = tmp.getContext('2d');
      for(let i=0;i<layers.length;i++){
        tctx.drawImage(layers[i],0,0);
      }
      return tmp.toDataURL();
    } else {
      return canvas.toDataURL();
    }
  }catch(e){ console.warn('getMergedDataURL failed', e); return canvas.toDataURL(); }
}

const ctx = canvas.getContext('2d');

// UI elements
const fileEl = document.getElementById('file');
const saveBtn = document.getElementById('saveImg');
const sizeEl = document.getElementById('size');
const colorEl = document.getElementById('color');
const txtEl = document.getElementById('txt');

// modes
let mode = 'off'; // draw, erase, rect, circle, arrow, text, line, triangle, dblarrow, soft, spray, fill, crop, off
let drawing = false;
let sx = 0, sy = 0; // start coords for many tools

// triangle state (collect 3 points)
let trianglePoints = [];

// history for undo/redo
let history = [];
let redoStack = [];

function saveState(initial=false){
  try{
    history.push(getMergedDataURL());
    if(history.length>80) history.shift();
    if(!initial) redoStack = [];
  }catch(e){ console.warn('saveState failed', e); }
}

// helpers to convert client coords to canvas coords (account for CSS scaling)
function clientToCanvas(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: Math.round((clientX - rect.left) * scaleX),
    y: Math.round((clientY - rect.top) * scaleY)
  };
}

function extractPosFromEvent(e){
  if(e.changedTouches && e.changedTouches.length){
    const t = e.changedTouches[0];
    return clientToCanvas(t.clientX, t.clientY);
  } else if(e.touches && e.touches.length){
    const t = e.touches[0];
    return clientToCanvas(t.clientX, t.clientY);
  } else {
    return clientToCanvas(e.clientX, e.clientY);
  }
}

// tool button bindings
document.getElementById('draw').onclick = ()=> setMode('draw');
document.getElementById('erase').onclick = ()=> setMode('erase');
document.getElementById('rect').onclick = ()=> setMode('rect');
document.getElementById('circle').onclick = ()=> setMode('circle');
document.getElementById('arrow').onclick = ()=> setMode('arrow');
document.getElementById('text').onclick = ()=> setMode('text');
document.getElementById('off').onclick = ()=> setMode('off');
document.getElementById('line').onclick = ()=> setMode('line');
document.getElementById('triangle').onclick = ()=> setMode('triangle');
document.getElementById('dblarrow').onclick = ()=> setMode('dblarrow');
document.getElementById('soft').onclick = ()=> setMode('soft');
document.getElementById('spray').onclick = ()=> setMode('spray');
document.getElementById('fill').onclick = ()=> setMode('fill');
document.getElementById('crop').onclick = ()=> setMode('crop');
document.getElementById('undo').onclick = undoAction;
document.getElementById('redo').onclick = redoAction;

// file load and save
fileEl.addEventListener('change', (e)=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const img = new Image();
  img.onload = ()=>{
    // set canvas to image natural size and draw
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0);
    saveState(true);
  };
  img.src = URL.createObjectURL(f);
});

saveBtn.addEventListener('click', ()=>{
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'image.png';
  a.click();
});

// history
function undoAction(){
  if(history.length < 2) return;
  redoStack.push(history.pop());
  const last = history[history.length-1];
  const img = new Image();
  img.onload = ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); };
  img.src = last;
}
function redoAction(){
  if(redoStack.length===0) return;
  const data = redoStack.pop();
  history.push(data);
  const img = new Image();
  img.onload = ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); };
  img.src = data;
}

// utility drawing helpers
function drawArrowBoth(x1,y1,x2,y2, color, width){
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const h = Math.max(8, width*2);
  // end arrow
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2 - h * Math.cos(ang - Math.PI/6), y2 - h * Math.sin(ang - Math.PI/6));
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2 - h * Math.cos(ang + Math.PI/6), y2 - h * Math.sin(ang + Math.PI/6));
  ctx.stroke();
  // start arrow
  const ang2 = ang + Math.PI;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x1 - h * Math.cos(ang2 - Math.PI/6), y1 - h * Math.sin(ang2 - Math.PI/6));
  ctx.moveTo(x1,y1);
  ctx.lineTo(x1 - h * Math.cos(ang2 + Math.PI/6), y1 - h * Math.sin(ang2 + Math.PI/6));
  ctx.stroke();
  ctx.restore();
}

function softStroke(x,y){
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = colorEl.value;
  ctx.beginPath();
  ctx.arc(x,y, Math.max(6, Number(sizeEl.value))*1.2, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function sprayAt(x,y){
  const density = 25;
  ctx.save();
  ctx.fillStyle = colorEl.value;
  for(let i=0;i<density;i++){
    const angle = Math.random()*Math.PI*2;
    const dist = Math.random()*Number(sizeEl.value)*1.4;
    const rx = x + Math.cos(angle)*dist;
    const ry = y + Math.sin(angle)*dist;
    ctx.fillRect(rx,ry,1,1);
  }
  ctx.restore();
}

// flood fill (pixel-based)
function floodFill(x,y,hexColor){
  const w = canvas.width, h = canvas.height;
  const imgData = ctx.getImageData(0,0,w,h);
  const data = imgData.data;
  function idx(ix,iy){ return (iy*w + ix)*4; }
  const sx = Math.max(0, Math.min(w-1, Math.floor(x)));
  const sy = Math.max(0, Math.min(h-1, Math.floor(y)));
  const start = idx(sx,sy);
  const tr = data[start], tg = data[start+1], tb = data[start+2], ta = data[start+3];
  const fr = parseInt(hexColor.slice(1,3),16);
  const fg = parseInt(hexColor.slice(3,5),16);
  const fb = parseInt(hexColor.slice(5,7),16);
  if(tr===fr && tg===fg && tb===fb) return;
  const seen = new Uint8Array(w*h);
  const stack = [[sx,sy]];
  while(stack.length){
    const [cx,cy] = stack.pop();
    if(cx<0||cx>=w||cy<0||cy>=h) continue;
    const idp = cy*w + cx;
    if(seen[idp]) continue;
    seen[idp]=1;
    const i = idp*4;
    if(data[i]===tr && data[i+1]===tg && data[i+2]===tb && data[i+3]===ta){
      data[i]=fr; data[i+1]=fg; data[i+2]=fb; data[i+3]=255;
      stack.push([cx+1,cy]); stack.push([cx-1,cy]); stack.push([cx,cy+1]); stack.push([cx,cy-1]);
    }
  }
  ctx.putImageData(imgData,0,0);
}

// crop selection
let cropSelecting = false;
let cropRect = null;

// Single unified pointer handlers (mouse & touch)
function pointerStart(e){
  if(e.cancelable) e.preventDefault();
  const p = extractPosFromEvent(e);
  // handle immediate modes
  if(mode === 'fill'){
    floodFill(p.x|0, p.y|0, colorEl.value);
    saveState();
    return;
  }
  if(mode === 'text'){
    getActiveCtx().save();
    getActiveCtx().fillStyle = colorEl.value;
    getActiveCtx().font = (Number(sizeEl.value)*3) + 'px sans-serif';
    getActiveCtx().fillText(txtEl.value || '', p.x, p.y);
    getActiveCtx().restore();
    saveState();
    return;
  }
  if(mode === 'crop'){
    cropSelecting = true;
    cropRect = {x0:p.x, y0:p.y, x1:p.x, y1:p.y};
    return;
  }
  if(mode === 'line' || mode === 'dblarrow' || mode === 'triangle'){
    // for triangle we collect points: each start acts as point
    if(mode === 'triangle'){
      trianglePoints.push([p.x|0, p.y|0]);
      if(trianglePoints.length === 3){
        // draw triangle
        getActiveCtx().save();
        getActiveCtx().beginPath();
        getActiveCtx().moveTo(trianglePoints[0][0], trianglePoints[0][1]);
        getActiveCtx().lineTo(trianglePoints[1][0], trianglePoints[1][1]);
        getActiveCtx().lineTo(trianglePoints[2][0], trianglePoints[2][1]);
        getActiveCtx().closePath();
        getActiveCtx().strokeStyle = colorEl.value;
        getActiveCtx().lineWidth = Number(sizeEl.value);
        getActiveCtx().stroke();
        getActiveCtx().restore();
        trianglePoints = [];
        saveState();
      }
      return;
    }
    // otherwise start line/dblarrow
    sx = p.x; sy = p.y;
    drawing = true;
    return;
  }

  // for soft/spray, draw starts immediately
  if(mode === 'soft' || mode === 'spray'){
    drawing = true;
    // call move once to draw initial mark
    if(mode === 'soft') softStroke(p.x, p.y);
    else sprayAt(p.x, p.y);
    return;
  }

  // default (draw/erase/rect/circle/arrow)
  drawing = true;
  sx = p.x; sy = p.y;
  getActiveCtx().beginPath();
  getActiveCtx().moveTo(sx, sy);
}

function pointerMove(e){
  if(!drawing && !cropSelecting) return;
  if(e.cancelable) e.preventDefault();
  const p = extractPosFromEvent(e);
  const x = p.x, y = p.y;

  // crop preview
  if(mode === 'crop' && cropSelecting){
    cropRect.x1 = x; cropRect.y1 = y;
    // redraw last saved state then overlay rectangle
    const img = new Image();
    img.onload = ()=>{
      getActiveCtx().clearRect(0,0,getActiveCanvas().width,getActiveCanvas().height);
      getActiveCtx().drawImage(img,0,0);
      getActiveCtx().save();
      getActiveCtx().setLineDash([6,4]);
      getActiveCtx().lineWidth = 2;
      getActiveCtx().strokeStyle = 'rgba(0,0,0,0.9)';
      getActiveCtx().strokeRect(cropRect.x0, cropRect.y0, cropRect.x1 - cropRect.x0, cropRect.y1 - cropRect.y0);
      getActiveCtx().restore();
    };
    img.src = history[history.length-1];
    return;
  }

  getActiveCtx().lineWidth = Number(sizeEl.value);
  getActiveCtx().lineCap = 'round';

  if(mode === 'draw'){
    getActiveCtx().strokeStyle = colorEl.value;
    getActiveCtx().lineTo(x,y);
    getActiveCtx().stroke();
  } else if(mode === 'erase'){
    getActiveCtx().save();
    getActiveCtx().globalCompositeOperation = 'destination-out';
    getActiveCtx().lineTo(x,y);
    getActiveCtx().stroke();
    getActiveCtx().restore();
  } else if(mode === 'soft' && drawing){
    softStroke(x,y);
  } else if(mode === 'spray' && drawing){
    sprayAt(x,y);
  } else {
    // nothing on move for other tools (shapes finalize on end)
  }
}

function pointerEnd(e){
  // if crop selecting finalize
  if(cropSelecting){
    const p = extractPosFromEvent(e);
    cropRect.x1 = p.x; cropRect.y1 = p.y;
    cropSelecting = false;
    const x = Math.min(cropRect.x0, cropRect.x1)|0;
    const y = Math.min(cropRect.y0, cropRect.y1)|0;
    const w = Math.abs(cropRect.x1 - cropRect.x0)|0;
    const h = Math.abs(cropRect.y1 - cropRect.y0)|0;
    if(w>0 && h>0){
      const imgd = getActiveCtx().getImageData(x,y,w,h);
      getActiveCanvas().width = w; getActiveCanvas().height = h;
      getActiveCtx().putImageData(imgd,0,0);
      saveState();
    }
    return;
  }

  if(!drawing) return;
  const p = extractPosFromEvent(e);
  const x = p.x, y = p.y;

  getActiveCtx().save();
  getActiveCtx().strokeStyle = colorEl.value;
  getActiveCtx().lineWidth = Number(sizeEl.value);

  if(mode === 'rect'){
    getActiveCtx().strokeRect(sx, sy, x - sx, y - sy);
  } else if(mode === 'circle'){
    const r = Math.hypot(x - sx, y - sy);
    getActiveCtx().beginPath();
    getActiveCtx().arc(sx, sy, r, 0, Math.PI*2);
    getActiveCtx().stroke();
  } else if(mode === 'arrow'){
    getActiveCtx().beginPath();
    getActiveCtx().moveTo(sx, sy);
    getActiveCtx().lineTo(x, y);
    getActiveCtx().stroke();
    const ang = Math.atan2(y - sy, x - sx);
    const h = Math.max(8, Number(sizeEl.value)*2);
    getActiveCtx().beginPath();
    getActiveCtx().moveTo(x, y);
    getActiveCtx().lineTo(x - h * Math.cos(ang - Math.PI/6), y - h * Math.sin(ang - Math.PI/6));
    getActiveCtx().moveTo(x, y);
    getActiveCtx().lineTo(x - h * Math.cos(ang + Math.PI/6), y - h * Math.sin(ang + Math.PI/6));
    getActiveCtx().stroke();
  } else if(mode === 'line'){
    getActiveCtx().beginPath();
    getActiveCtx().moveTo(sx, sy);
    getActiveCtx().lineTo(x, y);
    getActiveCtx().stroke();
  } else if(mode === 'dblarrow'){
    drawArrowBoth(sx, sy, x, y, colorEl.value, Number(sizeEl.value));
  }

  getActiveCtx().restore();
  drawing = false;
  saveState();
}

// attach mouse + touch events
getActiveCanvas().addEventListener('mousedown', pointerStart, {passive:false});
getActiveCanvas().addEventListener('mousemove', pointerMove, {passive:false});
getActiveCanvas().addEventListener('mouseup', pointerEnd, {passive:false});
getActiveCanvas().addEventListener('mouseleave', ()=>{ if(drawing) drawing=false; }, {passive:true});

getActiveCanvas().addEventListener('touchstart', pointerStart, {passive:false});
getActiveCanvas().addEventListener('touchmove', pointerMove, {passive:false});
getActiveCanvas().addEventListener('touchend', pointerEnd, {passive:false});
getActiveCanvas().addEventListener('touchcancel', ()=>{ drawing=false; }, {passive:true});

// initial blank canvas save
saveState(true);

</script>

<script>

<!-- Robust layers system: ensures canvas visible, events attached, safe add/delete, and UI refresh -->
<script>
(function(){
  // locate original canvas
  const original = document.getElementById('c');
  if(!original){
    console.warn('Original canvas #c not found — layers init aborted');
    return;
  }

  // create container if missing
  let layerContainer = document.getElementById('layerContainer');
  if(!layerContainer){
    layerContainer = document.createElement('div');
    layerContainer.id = 'layerContainer';
    layerContainer.style.position = 'relative';
    layerContainer.style.display = 'inline-block'; layerContainer.style.overflow = 'auto'; layerContainer.style.maxWidth = '100%'; layerContainer.style.maxHeight = '80vh';
    layerContainer.style.border = '1px solid #444';
    // ensure size matches canvas
    layerContainer.style.width = original.width + 'px';
    layerContainer.style.height = original.height + 'px';
    original.parentNode.insertBefore(layerContainer, original);
    layerContainer.appendChild(original);
  }

  // ensure original canvas positioned absolute and stretched to container
  original.style.position = 'absolute';
  original.style.left = '0px';
  original.style.top = '0px';
  original.style.zIndex = '0';

  // global layers array and activeLayer
  window.layers = window.layers || [];
  if(window.layers.length === 0){
    // populate with existing canvas elements inside container (preserve order)
    const canvases = layerContainer.querySelectorAll('canvas');
    canvases.forEach(c=> window.layers.push(c));
  }
  if(window.layers.indexOf(original) === -1){
    // ensure original is first
    window.layers.unshift(original);
  }
  window.activeLayer = (typeof window.activeLayer === 'number') ? window.activeLayer : 0;

  // helper functions
  function refreshLayersUI(){
    if(typeof window.refreshLayersUI === 'function') return window.refreshLayersUI();
    const box = document.getElementById('layersList');
    if(!box) return;
    box.innerHTML='';
    window.layers.forEach((c,i)=>{
      const d = document.createElement('div');
      d.textContent = 'Слой ' + (i+1);
      d.style.padding='6px'; d.style.margin='4px'; d.style.border='1px solid #aaa';
      d.style.background = (i===window.activeLayer ? '#c8e6ff' : '#eee');
      d.onclick = ()=>{ window.activeLayer = i; refreshLayersUI(); };
      box.appendChild(d);
      c.style.zIndex = i;
      c.style.position = 'absolute';
      c.style.left = '0px'; c.style.top = '0px';
      c.style.display = 'block';
    });
  }

  // attach pointer handlers to a canvas
  function attachCanvasListeners(cv){
    if(!cv || cv._listenersAttached) return;
    cv._listenersAttached = true;
    // wrapper to call handlers but only preventDefault when necessary (drawing active).
    function wrapStart(e){
      try{
        // determine if we should prevent scrolling: when global mode indicates drawing or drawing flag set
        var isDrawingMode = (typeof window.mode !== 'undefined' && window.mode !== 'off') || !!window.drawing;
        if(e.cancelable && isDrawingMode){ e.preventDefault(); }
        var startH = window.pointerStart || window.startPointer || window.pointerStart || null;
        if(startH) startH(e);
      }catch(err){ console.error(err); }
    }
    function wrapMove(e){
      try{
        var isDrawingMode = (typeof window.mode !== 'undefined' && window.mode !== 'off') || !!window.drawing;
        if(e.cancelable && isDrawingMode){ e.preventDefault(); }
        var moveH = window.pointerMove || window.movePointer || null;
        if(moveH) moveH(e);
      }catch(err){ console.error(err); }
    }
    function wrapEnd(e){
      try{
        var isDrawingMode = (typeof window.mode !== 'undefined' && window.mode !== 'off') || !!window.drawing;
        if(e.cancelable && isDrawingMode){ e.preventDefault(); }
        var endH = window.pointerEnd || window.endPointer || null;
        if(endH) endH(e);
      }catch(err){ console.error(err); }
    }
    // mouse listeners (preventDefault only when drawing)
    cv.addEventListener('mousedown', wrapStart, {passive:false});
    cv.addEventListener('mousemove', wrapMove, {passive:false});
    cv.addEventListener('mouseup', wrapEnd, {passive:false});
    // touch listeners: allow default scrolling when not drawing; wrappers handle conditional preventDefault
    cv.addEventListener('touchstart', wrapStart, {passive:false});
    cv.addEventListener('touchmove', wrapMove, {passive:false});
    cv.addEventListener('touchend', wrapEnd, {passive:false});
    cv.addEventListener('mouseleave', function(){ try{ window.drawing=false; }catch(e){} }, {passive:true});
  });
    if(moveH) cv.addEventListener('mousemove', moveH, {passive:false});
    if(endH) cv.addEventListener('mouseup', endH, {passive:false});
    if(startH) cv.addEventListener('touchstart', startH, {passive:false});
    if(moveH) cv.addEventListener('touchmove', moveH, {passive:false});
    if(endH) cv.addEventListener('touchend', endH, {passive:false});
    cv.addEventListener('mouseleave', ()=>{ try{ window.drawing=false; }catch(e){} }, {passive:true});
  }

  // ensure listeners on existing layers
  window.layers.forEach(attachCanvasListeners);

  // safe add layer function
  function safeAddLayer(){
    const base = window.layers[0] || original;
    const nc = document.createElement('canvas');
    nc.width = base.width || original.width || 800;
    nc.height = base.height || original.height || 600;
    nc.className = 'layerCanvas';
    nc.style.position='absolute'; nc.style.left='0'; nc.style.top='0';
    layerContainer.appendChild(nc);
    window.layers.push(nc);
    window.activeLayer = window.layers.length - 1;
    attachCanvasListeners(nc);
    refreshLayersUI();
    return nc;
  }

  // safe delete layer function — never delete last canvas
  function safeDelLayer(){
    if(!window.layers || window.layers.length <= 1) return false;
    const idx = window.activeLayer;
    const cv = window.layers[idx];
    if(cv && cv.parentNode) cv.parentNode.removeChild(cv);
    window.layers.splice(idx,1);
    // ensure active index valid
    if(idx >= window.layers.length) window.activeLayer = window.layers.length - 1;
    else window.activeLayer = Math.max(0, idx);
    refreshLayersUI();
    return true;
  }

  // override UI buttons to these safe implementations
  const addBtn = document.getElementById('addLayer');
  if(addBtn) addBtn.onclick = safeAddLayer;
  const delBtn = document.getElementById('delLayer');
  if(delBtn) delBtn.onclick = safeDelLayer;
  const upBtn = document.getElementById('layerUp');
  if(upBtn) upBtn.onclick = function(){
    const i = window.activeLayer;
    if(i < window.layers.length -1){
      const tmp = window.layers[i];
      window.layers[i] = window.layers[i+1];
      window.layers[i+1] = tmp;
      window.activeLayer = i+1;
      // reattach DOM order
      window.layers.forEach(c=> layerContainer.appendChild(c));
      refreshLayersUI();
    }
  };
  const downBtn = document.getElementById('layerDown');
  if(downBtn) downBtn.onclick = function(){
    const i = window.activeLayer;
    if(i > 0){
      const tmp = window.layers[i];
      window.layers[i] = window.layers[i-1];
      window.layers[i-1] = tmp;
      window.activeLayer = i-1;
      window.layers.forEach(c=> layerContainer.appendChild(c));
      refreshLayersUI();
    }
  };

  // observe new canvas nodes and auto attach listeners
  try{
    const mo = new MutationObserver(function(muts){
      muts.forEach(m=> m.addedNodes.forEach(n=> { if(n && n.tagName && n.tagName.toLowerCase()==='canvas') attachCanvasListeners(n); }));
    });
    mo.observe(layerContainer,{childList:true, subtree:false});
  }catch(e){}

  // ensure container size matches first layer
  function ensureContainerSize(){
    try{
      const w = window.layers[0].width, h = window.layers[0].height;
      layerContainer.style.width = w + 'px';
      layerContainer.style.height = h + 'px';
    }catch(e){}
  }

  // initial UI refresh & ensure container size
  ensureContainerSize();
  refreshLayersUI();
  console.log('Robust layers initialized.');
})();
</script>


<!-- LAYERS PATCH: fixes delete/add layer and event binding -->
<script>
(function(){
  // find global layers array and activeLayer; if not present, do nothing
  if(typeof window.layers === 'undefined' || typeof window.activeLayer === 'undefined') {
    // try to detect layers defined under other scopes; if not found, exit
  }

  // helper to get existing handlers (try multiple common names)
  function getHandler(names){
    for(var i=0;i<names.length;i++){
      var fn = window[names[i]];
      if(typeof fn === 'function') return fn;
    }
    return null;
  }
  var startH = getHandler(['pointerStart','startPointer','onPointerStart','handlePointerStart']);
  var moveH = getHandler(['pointerMove','movePointer','onPointerMove','handlePointerMove']);
  var endH = getHandler(['pointerEnd','endPointer','onPointerEnd','handlePointerEnd']);

  // attach proper listeners to a canvas element
  function attachCanvasListeners(cv){
    // avoid double attaching
    if(cv._layerPatched) return;
    cv._layerPatched = true;
    if(startH) cv.addEventListener('mousedown', startH, {passive:false});
    if(moveH) cv.addEventListener('mousemove', moveH, {passive:false});
    if(endH) cv.addEventListener('mouseup', endH, {passive:false});
    // touch
    if(startH) cv.addEventListener('touchstart', startH, {passive:false});
    if(moveH) cv.addEventListener('touchmove', moveH, {passive:false});
    if(endH) cv.addEventListener('touchend', endH, {passive:false});
    // ensure mouseleave cancels drawing
    cv.addEventListener('mouseleave', function(){ try{ window.drawing = false; }catch(e){} }, {passive:true});
  }

  // patch existing layers array if present
  try{
    if(window.layers && window.layers.length){
      for(var i=0;i<window.layers.length;i++){
        attachCanvasListeners(window.layers[i]);
      }
    }
  }catch(e){ console.warn('layers patch initial attach failed', e); }

  // override addLayer and delLayer if they exist to ensure correct behavior
  function safeAddLayer(){
    try{
      var base = (window.layers && window.layers[0]) ? window.layers[0] : document.querySelector('canvas');
      var w = base.width||800, h = base.height||600;
      var nc = document.createElement('canvas');
      nc.width = w; nc.height = h;
      nc.style.position='absolute'; nc.style.left='0'; nc.style.top='0';
      nc.className = 'layerCanvas';
      // append to same parent as base
      base.parentNode.appendChild(nc);
      if(!window.layers) window.layers = [];
      window.layers.push(nc);
      window.activeLayer = window.layers.length-1;
      attachCanvasListeners(nc);
      // refresh UI if function exists
      if(typeof window.refreshLayersUI === 'function') window.refreshLayersUI();
      return nc;
    }catch(e){ console.error('safeAddLayer failed', e); }
  }

  function safeDelLayer(){
    try{
      if(!window.layers || window.layers.length<=1) return false;
      var idx = window.activeLayer;
      var cv = window.layers[idx];
      if(cv && cv.parentNode) cv.parentNode.removeChild(cv);
      window.layers.splice(idx,1);
      // ensure activeLayer points to valid index
      if(idx >= window.layers.length) window.activeLayer = window.layers.length-1;
      else window.activeLayer = Math.max(0, idx);
      // refresh UI
      if(typeof window.refreshLayersUI === 'function') window.refreshLayersUI();
      return true;
    }catch(e){ console.error('safeDelLayer failed', e); return false; }
  }

  // If original functions exist, back them up and replace
  if(typeof window.addLayer === 'function') window._orig_addLayer = window.addLayer;
  window.addLayer = safeAddLayer;
  if(typeof window.delLayer === 'function') window._orig_delLayer = window.delLayer;
  window.delLayer = safeDelLayer;

  // If there is a container where new layers are appended, ensure event delegation works too
  try{
    var container = window.layerContainer || document.querySelector('div[style*=\"position:relative\"]') || document.body;
    // observe new child nodes and attach listeners
    var mo = new MutationObserver(function(muts){
      muts.forEach(function(m){
        m.addedNodes.forEach(function(n){
          if(n && n.tagName && n.tagName.toLowerCase()==='canvas') attachCanvasListeners(n);
        });
      });
    });
    mo.observe(container,{childList:true, subtree:true});
  }catch(e){ /* ignore */ }

  console.log('Layers patch applied.'); 
})();
</script>

<script>function setMode(m){
  mode = m;
  trianglePoints = [];
  drawing = false;
  cropSelecting = false;
}

/* Unified drawing system with many tools and no name conflicts.
Triangle mode: 3 clicks/presses create a triangle (variant 2 requested).
Works with mouse and touch. */

const canvas = document.getElementById('c');

// --- Layers-aware helpers (injected) ---
function getActiveCanvas(){
  // layers array may be defined later; fall back to original canvas
  try{
    if(typeof layers !== 'undefined' && layers.length>0) return layers[activeLayer];
  }catch(e){}
  return canvas;
}
function getActiveCtx(){
  return getActiveCanvas().getContext('2d');
}
// merge all layers into a temporary canvas and return dataURL
function getMergedDataURL(){
  try{
    // if layers exist, draw them in order; otherwise use main canvas
    if(typeof layers !== 'undefined' && layers.length>0){
      const w = layers[0].width, h = layers[0].height;
      const tmp = document.createElement('canvas');
      tmp.width = w; tmp.height = h;
      const tctx = tmp.getContext('2d');
      for(let i=0;i<layers.length;i++){
        tctx.drawImage(layers[i],0,0);
      }
      return tmp.toDataURL();
    } else {
      return canvas.toDataURL();
    }
  }catch(e){ console.warn('getMergedDataURL failed', e); return canvas.toDataURL(); }
}

const ctx = canvas.getContext('2d');

// UI elements
const fileEl = document.getElementById('file');
const saveBtn = document.getElementById('saveImg');
const sizeEl = document.getElementById('size');
const colorEl = document.getElementById('color');
const txtEl = document.getElementById('txt');

// modes
let mode = 'off'; // draw, erase, rect, circle, arrow, text, line, triangle, dblarrow, soft, spray, fill, crop, off
let drawing = false;
let sx = 0, sy = 0; // start coords for many tools

// triangle state (collect 3 points)
let trianglePoints = [];

// history for undo/redo
let history = [];
let redoStack = [];

function saveState(initial=false){
  try{
    history.push(getMergedDataURL());
    if(history.length>80) history.shift();
    if(!initial) redoStack = [];
  }catch(e){ console.warn('saveState failed', e); }
}

// helpers to convert client coords to canvas coords (account for CSS scaling)
function clientToCanvas(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: Math.round((clientX - rect.left) * scaleX),
    y: Math.round((clientY - rect.top) * scaleY)
  };
}

function extractPosFromEvent(e){
  if(e.changedTouches && e.changedTouches.length){
    const t = e.changedTouches[0];
    return clientToCanvas(t.clientX, t.clientY);
  } else if(e.touches && e.touches.length){
    const t = e.touches[0];
    return clientToCanvas(t.clientX, t.clientY);
  } else {
    return clientToCanvas(e.clientX, e.clientY);
  }
}

// tool button bindings
document.getElementById('draw').onclick = ()=> setMode('draw');
document.getElementById('erase').onclick = ()=> setMode('erase');
document.getElementById('rect').onclick = ()=> setMode('rect');
document.getElementById('circle').onclick = ()=> setMode('circle');
document.getElementById('arrow').onclick = ()=> setMode('arrow');
document.getElementById('text').onclick = ()=> setMode('text');
document.getElementById('off').onclick = ()=> setMode('off');
document.getElementById('line').onclick = ()=> setMode('line');
document.getElementById('triangle').onclick = ()=> setMode('triangle');
document.getElementById('dblarrow').onclick = ()=> setMode('dblarrow');
document.getElementById('soft').onclick = ()=> setMode('soft');
document.getElementById('spray').onclick = ()=> setMode('spray');
document.getElementById('fill').onclick = ()=> setMode('fill');
document.getElementById('crop').onclick = ()=> setMode('crop');
document.getElementById('undo').onclick = undoAction;
document.getElementById('redo').onclick = redoAction;

// file load and save
fileEl.addEventListener('change', (e)=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const img = new Image();
  img.onload = ()=>{
    // set canvas to image natural size and draw
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0);
    saveState(true);
  };
  img.src = URL.createObjectURL(f);
});

saveBtn.addEventListener('click', ()=>{
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'image.png';
  a.click();
});

// history
function undoAction(){
  if(history.length < 2) return;
  redoStack.push(history.pop());
  const last = history[history.length-1];
  const img = new Image();
  img.onload = ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); };
  img.src = last;
}
function redoAction(){
  if(redoStack.length===0) return;
  const data = redoStack.pop();
  history.push(data);
  const img = new Image();
  img.onload = ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); };
  img.src = data;
}

// utility drawing helpers
function drawArrowBoth(x1,y1,x2,y2, color, width){
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const h = Math.max(8, width*2);
  // end arrow
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2 - h * Math.cos(ang - Math.PI/6), y2 - h * Math.sin(ang - Math.PI/6));
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2 - h * Math.cos(ang + Math.PI/6), y2 - h * Math.sin(ang + Math.PI/6));
  ctx.stroke();
  // start arrow
  const ang2 = ang + Math.PI;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x1 - h * Math.cos(ang2 - Math.PI/6), y1 - h * Math.sin(ang2 - Math.PI/6));
  ctx.moveTo(x1,y1);
  ctx.lineTo(x1 - h * Math.cos(ang2 + Math.PI/6), y1 - h * Math.sin(ang2 + Math.PI/6));
  ctx.stroke();
  ctx.restore();
}

function softStroke(x,y){
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = colorEl.value;
  ctx.beginPath();
  ctx.arc(x,y, Math.max(6, Number(sizeEl.value))*1.2, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function sprayAt(x,y){
  const density = 25;
  ctx.save();
  ctx.fillStyle = colorEl.value;
  for(let i=0;i<density;i++){
    const angle = Math.random()*Math.PI*2;
    const dist = Math.random()*Number(sizeEl.value)*1.4;
    const rx = x + Math.cos(angle)*dist;
    const ry = y + Math.sin(angle)*dist;
    ctx.fillRect(rx,ry,1,1);
  }
  ctx.restore();
}

// flood fill (pixel-based)
function floodFill(x,y,hexColor){
  const w = canvas.width, h = canvas.height;
  const imgData = ctx.getImageData(0,0,w,h);
  const data = imgData.data;
  function idx(ix,iy){ return (iy*w + ix)*4; }
  const sx = Math.max(0, Math.min(w-1, Math.floor(x)));
  const sy = Math.max(0, Math.min(h-1, Math.floor(y)));
  const start = idx(sx,sy);
  const tr = data[start], tg = data[start+1], tb = data[start+2], ta = data[start+3];
  const fr = parseInt(hexColor.slice(1,3),16);
  const fg = parseInt(hexColor.slice(3,5),16);
  const fb = parseInt(hexColor.slice(5,7),16);
  if(tr===fr && tg===fg && tb===fb) return;
  const seen = new Uint8Array(w*h);
  const stack = [[sx,sy]];
  while(stack.length){
    const [cx,cy] = stack.pop();
    if(cx<0||cx>=w||cy<0||cy>=h) continue;
    const idp = cy*w + cx;
    if(seen[idp]) continue;
    seen[idp]=1;
    const i = idp*4;
    if(data[i]===tr && data[i+1]===tg && data[i+2]===tb && data[i+3]===ta){
      data[i]=fr; data[i+1]=fg; data[i+2]=fb; data[i+3]=255;
      stack.push([cx+1,cy]); stack.push([cx-1,cy]); stack.push([cx,cy+1]); stack.push([cx,cy-1]);
    }
  }
  ctx.putImageData(imgData,0,0);
}

// crop selection
let cropSelecting = false;
let cropRect = null;

// Single unified pointer handlers (mouse & touch)
function pointerStart(e){
  if(e.cancelable) e.preventDefault();
  const p = extractPosFromEvent(e);
  // handle immediate modes
  if(mode === 'fill'){
    floodFill(p.x|0, p.y|0, colorEl.value);
    saveState();
    return;
  }
  if(mode === 'text'){
    getActiveCtx().save();
    getActiveCtx().fillStyle = colorEl.value;
    getActiveCtx().font = (Number(sizeEl.value)*3) + 'px sans-serif';
    getActiveCtx().fillText(txtEl.value || '', p.x, p.y);
    getActiveCtx().restore();
    saveState();
    return;
  }
  if(mode === 'crop'){
    cropSelecting = true;
    cropRect = {x0:p.x, y0:p.y, x1:p.x, y1:p.y};
    return;
  }
  if(mode === 'line' || mode === 'dblarrow' || mode === 'triangle'){
    // for triangle we collect points: each start acts as point
    if(mode === 'triangle'){
      trianglePoints.push([p.x|0, p.y|0]);
      if(trianglePoints.length === 3){
        // draw triangle
        getActiveCtx().save();
        getActiveCtx().beginPath();
        getActiveCtx().moveTo(trianglePoints[0][0], trianglePoints[0][1]);
        getActiveCtx().lineTo(trianglePoints[1][0], trianglePoints[1][1]);
        getActiveCtx().lineTo(trianglePoints[2][0], trianglePoints[2][1]);
        getActiveCtx().closePath();
        getActiveCtx().strokeStyle = colorEl.value;
        getActiveCtx().lineWidth = Number(sizeEl.value);
        getActiveCtx().stroke();
        getActiveCtx().restore();
        trianglePoints = [];
        saveState();
      }
      return;
    }
    // otherwise start line/dblarrow
    sx = p.x; sy = p.y;
    drawing = true;
    return;
  }

  // for soft/spray, draw starts immediately
  if(mode === 'soft' || mode === 'spray'){
    drawing = true;
    // call move once to draw initial mark
    if(mode === 'soft') softStroke(p.x, p.y);
    else sprayAt(p.x, p.y);
    return;
  }

  // default (draw/erase/rect/circle/arrow)
  drawing = true;
  sx = p.x; sy = p.y;
  getActiveCtx().beginPath();
  getActiveCtx().moveTo(sx, sy);
}

function pointerMove(e){
  if(!drawing && !cropSelecting) return;
  if(e.cancelable) e.preventDefault();
  const p = extractPosFromEvent(e);
  const x = p.x, y = p.y;

  // crop preview
  if(mode === 'crop' && cropSelecting){
    cropRect.x1 = x; cropRect.y1 = y;
    // redraw last saved state then overlay rectangle
    const img = new Image();
    img.onload = ()=>{
      getActiveCtx().clearRect(0,0,getActiveCanvas().width,getActiveCanvas().height);
      getActiveCtx().drawImage(img,0,0);
      getActiveCtx().save();
      getActiveCtx().setLineDash([6,4]);
      getActiveCtx().lineWidth = 2;
      getActiveCtx().strokeStyle = 'rgba(0,0,0,0.9)';
      getActiveCtx().strokeRect(cropRect.x0, cropRect.y0, cropRect.x1 - cropRect.x0, cropRect.y1 - cropRect.y0);
      getActiveCtx().restore();
    };
    img.src = history[history.length-1];
    return;
  }

  getActiveCtx().lineWidth = Number(sizeEl.value);
  getActiveCtx().lineCap = 'round';

  if(mode === 'draw'){
    getActiveCtx().strokeStyle = colorEl.value;
    getActiveCtx().lineTo(x,y);
    getActiveCtx().stroke();
  } else if(mode === 'erase'){
    getActiveCtx().save();
    getActiveCtx().globalCompositeOperation = 'destination-out';
    getActiveCtx().lineTo(x,y);
    getActiveCtx().stroke();
    getActiveCtx().restore();
  } else if(mode === 'soft' && drawing){
    softStroke(x,y);
  } else if(mode === 'spray' && drawing){
    sprayAt(x,y);
  } else {
    // nothing on move for other tools (shapes finalize on end)
  }
}

function pointerEnd(e){
  // if crop selecting finalize
  if(cropSelecting){
    const p = extractPosFromEvent(e);
    cropRect.x1 = p.x; cropRect.y1 = p.y;
    cropSelecting = false;
    const x = Math.min(cropRect.x0, cropRect.x1)|0;
    const y = Math.min(cropRect.y0, cropRect.y1)|0;
    const w = Math.abs(cropRect.x1 - cropRect.x0)|0;
    const h = Math.abs(cropRect.y1 - cropRect.y0)|0;
    if(w>0 && h>0){
      const imgd = getActiveCtx().getImageData(x,y,w,h);
      getActiveCanvas().width = w; getActiveCanvas().height = h;
      getActiveCtx().putImageData(imgd,0,0);
      saveState();
    }
    return;
  }

  if(!drawing) return;
  const p = extractPosFromEvent(e);
  const x = p.x, y = p.y;

  getActiveCtx().save();
  getActiveCtx().strokeStyle = colorEl.value;
  getActiveCtx().lineWidth = Number(sizeEl.value);

  if(mode === 'rect'){
    getActiveCtx().strokeRect(sx, sy, x - sx, y - sy);

  ctx.lineTo(x2 - h * Math.cos(ang - Math.PI/6), y2 - h * Math.sin(ang - Math.PI/6));

  ctx.lineTo(x2 - h * Math.cos(ang + Math.PI/6), y2 - h * Math.sin(ang + Math.PI/6));

  const ang2 = ang + Math.PI;

  ctx.moveTo(x1,y1);
  ctx.lineTo(x1 - h * Math.cos(ang2 - Math.PI/6), y1 - h * Math.sin(ang2 - Math.PI/6));

  ctx.restore();

function sprayAt(x,y){

    const angle = Math.random()*Math.PI*2;
    const dist = Math.random()*Number(sizeEl.value)*1.4;
    const rx = x + Math.cos(angle)*dist;
    const ry = y + Math.sin(angle)*dist;

function floodFill(x,y,hexColor){
  const w = canvas.width, h = canvas.height;
  const imgData = ctx.getImageData(0,0,w,h);
  const data = imgData.data;
  function idx(ix,iy){ return (iy*w + ix)*4; }
  const sx = Math.max(0, Math.min(w-1, Math.floor(x)));
  const sy = Math.max(0, Math.min(h-1, Math.floor(y)));
  const start = idx(sx,sy);
  const tr = data[start], tg = data[start+1], tb = data[start+2], ta = data[start+3];
  const fr = parseInt(hexColor.slice(1,3),16);
  const fg = parseInt(hexColor.slice(3,5),16);
  const fb = parseInt(hexColor.slice(5,7),16);
  if(tr===fr && tg===fg && tb===fb) return;
  const seen = new Uint8Array(w*h);
  const stack = [[sx,sy]];
  while(stack.length){
    const [cx,cy] = stack.pop();
    if(cx<0||cx>=w||cy<0||cy>=h) continue;
    const idp = cy*w + cx;
    if(seen[idp]) continue;
    seen[idp]=1;
    const i = idp*4;
    if(data[i]===tr && data[i+1]===tg && data[i+2]===tb && data[i+3]===ta){
      data[i]=fr; data[i+1]=fg; data[i+2]=fb; data[i+3]=255;

  getActiveCtx().moveTo(sx, sy);

    return;
  }

  getActiveCtx().lineCap = 'round';

  if(mode === 'draw'){
    getActiveCtx().strokeStyle = colorEl.value;
    getActiveCtx().lineTo(x,y);
    getActiveCtx().stroke();

    getActiveCtx().globalCompositeOperation = 'destination-out';
    getActiveCtx().lineTo(x,y);
    getActiveCtx().stroke();

    const x = Math.min(cropRect.x0, cropRect.x1)|0;
    const y = Math.min(cropRect.y0, cropRect.y1)|0;
    const w = Math.abs(cropRect.x1 - cropRect.x0)|0;
    const h = Math.abs(cropRect.y1 - cropRect.y0)|0;

      getActiveCanvas().width = w; getActiveCanvas().height = h;
      getActiveCtx().putImageData(imgd,0,0);
      saveState();
    }
    return;
  }

  if(!drawing) return;
  const p = extractPosFromEvent(e);
  const x = p.x, y = p.y;

  getActiveCtx().save();
  getActiveCtx().strokeStyle = colorEl.value;
  getActiveCtx().lineWidth = Number(sizeEl.value);

  if(mode === 'rect'){
    getActiveCtx().strokeRect(sx, sy, x - sx, y - sy);
  } else if(mode === 'circle'){
    const r = Math.hypot(x - sx, y - sy);
    getActiveCtx().beginPath();
    getActiveCtx().arc(sx, sy, r, 0, Math.PI*2);
    getActiveCtx().stroke();
  } else if(mode === 'arrow'){
    getActiveCtx().beginPath();
    getActiveCtx().moveTo(sx, sy);
    getActiveCtx().lineTo(x, y);
    getActiveCtx().stroke();
    const ang = Math.atan2(y - sy, x - sx);
    const h = Math.max(8, Number(sizeEl.value)*2);
    getActiveCtx().beginPath();
    getActiveCtx().moveTo(x, y);
    getActiveCtx().lineTo(x - h * Math.cos(ang - Math.PI/6), y - h * Math.sin(ang - Math.PI/6));
    getActiveCtx().moveTo(x, y);
    getActiveCtx().lineTo(x - h * Math.cos(ang + Math.PI/6), y - h * Math.sin(ang + Math.PI/6));
    getActiveCtx().stroke();
  } else if(mode === 'line'){
    getActiveCtx().beginPath();
    getActiveCtx().moveTo(sx, sy);
    getActiveCtx().lineTo(x, y);
    getActiveCtx().stroke();
  } else if(mode === 'dblarrow'){
    drawArrowBoth(sx, sy, x, y, colorEl.value, Number(sizeEl.value));
  }

  getActiveCtx().restore();
  drawing = false;
  saveState();
}

// helpers to convert client coords to canvas coords (account for CSS scaling)
function clientToCanvas(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: Math.round((clientX - rect.left) * scaleX),
    y: Math.round((clientY - rect.top) * scaleY)
  };
}

function extractPosFromEvent(e){
  if(e.changedTouches && e.changedTouches.length){
    const t = e.changedTouches[0];
    return clientToCanvas(t.clientX, t.clientY);
  } else if(e.touches && e.touches.length){
    const t = e.touches[0];
    return clientToCanvas(t.clientX, t.clientY);
  } else {
    return clientToCanvas(e.clientX, e.clientY);
  }
}

// utility drawing helpers
function drawArrowBoth(x1,y1,x2,y2, color, width){
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const h = Math.max(8, width*2);
  // end arrow
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2 - h * Math.cos(ang - Math.PI/6), y2 - h * Math.sin(ang - Math.PI/6));
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2 - h * Math.cos(ang + Math.PI/6), y2 - h * Math.sin(ang + Math.PI/6));
  ctx.stroke();
  // start arrow
  const ang2 = ang + Math.PI;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x1 - h * Math.cos(ang2 - Math.PI/6), y1 - h * Math.sin(ang2 - Math.PI/6));
  ctx.moveTo(x1,y1);
  ctx.lineTo(x1 - h * Math.cos(ang2 + Math.PI/6), y1 - h * Math.sin(ang2 + Math.PI/6));
  ctx.stroke();
  ctx.restore();
}

function softStroke(x,y){
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = colorEl.value;
  ctx.beginPath();
  ctx.arc(x,y, Math.max(6, Number(sizeEl.value))*1.2, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function sprayAt(x,y){
  const density = 25;
  ctx.save();
  ctx.fillStyle = colorEl.value;
  for(let i=0;i<density;i++){
    const angle = Math.random()*Math.PI*2;
    const dist = Math.random()*Number(sizeEl.value)*1.4;
    const rx = x + Math.cos(angle)*dist;
    const ry = y + Math.sin(angle)*dist;
    ctx.fillRect(rx,ry,1,1);
  }
  ctx.restore();
}

// flood fill (pixel-based)
function floodFill(x,y,hexColor){
  const w = canvas.width, h = canvas.height;
  const imgData = ctx.getImageData(0,0,w,h);
  const data = imgData.data;
  function idx(ix,iy){ return (iy*w + ix)*4; }
  const sx = Math.max(0, Math.min(w-1, Math.floor(x)));
  const sy = Math.max(0, Math.min(h-1, Math.floor(y)));
  const start = idx(sx,sy);
  const tr = data[start], tg = data[start+1], tb = data[start+2], ta = data[start+3];
  const fr = parseInt(hexColor.slice(1,3),16);
  const fg = parseInt(hexColor.slice(3,5),16);
  const fb = parseInt(hexColor.slice(5,7),16);
  if(tr===fr && tg===fg && tb===fb) return;
  const seen = new Uint8Array(w*h);
  const stack = [[sx,sy]];
  while(stack.length){
    const [cx,cy] = stack.pop();
    if(cx<0||cx>=w||cy<0||cy>=h) continue;
    const idp = cy*w + cx;
    if(seen[idp]) continue;
    seen[idp]=1;
    const i = idp*4;
    if(data[i]===tr && data[i+1]===tg && data[i+2]===tb && data[i+3]===ta){
      data[i]=fr; data[i+1]=fg; data[i+2]=fb; data[i+3]=255;
      stack.push([cx+1,cy]); stack.push([cx-1,cy]); stack.push([cx,cy+1]); stack.push([cx,cy-1]);
    }
  }
  ctx.putImageData(imgData,0,0);
}

// crop selection
let cropSelecting = false;
let cropRect = null;

// Single unified pointer handlers (mouse & touch)
function pointerStart(e){
  if(e.cancelable) e.preventDefault();
  const p = extractPosFromEvent(e);
  // handle immediate modes
  if(mode === 'fill'){
    floodFill(p.x|0, p.y|0, colorEl.value);
    saveState();
    return;
  }
  if(mode === 'text'){
    getActiveCtx().save();
    getActiveCtx().fillStyle = colorEl.value;
    getActiveCtx().font = (Number(sizeEl.value)*3) + 'px sans-serif';
    getActiveCtx().fillText(txtEl.value || '', p.x, p.y);
    getActiveCtx().restore();
    saveState();
    return;
  }
  if(mode === 'crop'){
    cropSelecting = true;
    cropRect = {x0:p.x, y0:p.y, x1:p.x, y1:p.y};
    return;
  }
  if(mode === 'line' || mode === 'dblarrow' || mode === 'triangle'){
    // for triangle we collect points: each start acts as point
    if(mode === 'triangle'){
      trianglePoints.push([p.x|0, p.y|0]);
      if(trianglePoints.length === 3){
        // draw triangle
        getActiveCtx().save();
        getActiveCtx().beginPath();
        getActiveCtx().moveTo(trianglePoints[0][0], trianglePoints[0][1]);
        getActiveCtx().lineTo(trianglePoints[1][0], trianglePoints[1][1]);
        getActiveCtx().lineTo(trianglePoints[2][0], trianglePoints[2][1]);
        getActiveCtx().closePath();
        getActiveCtx().strokeStyle = colorEl.value;
        getActiveCtx().lineWidth = Number(sizeEl.value);
        getActiveCtx().stroke();
        getActiveCtx().restore();
        trianglePoints = [];
        saveState();
      }
      return;
    }
    // otherwise start line/dblarrow
    sx = p.x; sy = p.y;
    drawing = true;
    return;
  }

  // for soft/spray, draw starts immediately
  if(mode === 'soft' || mode === 'spray'){
    drawing = true;
    // call move once to draw initial mark
    if(mode === 'soft') softStroke(p.x, p.y);
    else sprayAt(p.x, p.y);
    return;
  }

  // default (draw/erase/rect/circle/arrow)
  drawing = true;
  sx = p.x; sy = p.y;
  getActiveCtx().beginPath();
  getActiveCtx().moveTo(sx, sy);
}

function pointerMove(e){
  if(!drawing && !cropSelecting) return;
  if(e.cancelable) e.preventDefault();
  const p = extractPosFromEvent(e);
  const x = p.x, y = p.y;

  // crop preview
  if(mode === 'crop' && cropSelecting){
    cropRect.x1 = x; cropRect.y1 = y;
    // redraw last saved state then overlay rectangle
    const img = new Image();
    img.onload = ()=>{
      getActiveCtx().clearRect(0,0,getActiveCanvas().width,getActiveCanvas().height);
      getActiveCtx().drawImage(img,0,0);
      getActiveCtx().save();
      getActiveCtx().setLineDash([6,4]);
      getActiveCtx().lineWidth = 2;
      getActiveCtx().strokeStyle = 'rgba(0,0,0,0.9)';
      getActiveCtx().strokeRect(cropRect.x0, cropRect.y0, cropRect.x1 - cropRect.x0, cropRect.y1 - cropRect.y0);
      getActiveCtx().restore();
    };
    img.src = history[history.length-1];
    return;
  }

  getActiveCtx().lineWidth = Number(sizeEl.value);
  getActiveCtx().lineCap = 'round';

  if(mode === 'draw'){
    getActiveCtx().strokeStyle = colorEl.value;
    getActiveCtx().lineTo(x,y);
    getActiveCtx().stroke();
  } else if(mode === 'erase'){
    getActiveCtx().save();
    getActiveCtx().globalCompositeOperation = 'destination-out';
    getActiveCtx().lineTo(x,y);
    getActiveCtx().stroke();
    getActiveCtx().restore();
  } else if(mode === 'soft' && drawing){
    softStroke(x,y);
  } else if(mode === 'spray' && drawing){
    sprayAt(x,y);
  } else {
    // nothing on move for other tools (shapes finalize on end)
  }
}

function pointerEnd(e){
  // if crop selecting finalize
  if(cropSelecting){
    const p = extractPosFromEvent(e);
    cropRect.x1 = p.x; cropRect.y1 = p.y;
    cropSelecting = false;
    const x = Math.min(cropRect.x0, cropRect.x1)|0;
    const y = Math.min(cropRect.y0, cropRect.y1)|0;
    const w = Math.abs(cropRect.x1 - cropRect.x0)|0;
    const h = Math.abs(cropRect.y1 - cropRect.y0)|0;
    if(w>0 && h>0){
      const imgd = getActiveCtx().getImageData(x,y,w,h);
      getActiveCanvas().width = w; getActiveCanvas().height = h;
      getActiveCtx().putImageData(imgd,0,0);
      saveState();
    }
    return;
  }

  if(!drawing) return;
  const p = extractPosFromEvent(e);
  const x = p.x, y = p.y;

  getActiveCtx().save();
  getActiveCtx().strokeStyle = colorEl.value;
  getActiveCtx().lineWidth = Number(sizeEl.value);

  if(mode === 'rect'){
    getActiveCtx().strokeRect(sx, sy, x - sx, y - sy);
  } else if(mode === 'circle'){
    const r = Math.hypot(x - sx, y - sy);
    getActiveCtx().beginPath();
    getActiveCtx().arc(sx, sy, r, 0, Math.PI*2);
    getActiveCtx().stroke();
  } else if(mode === 'arrow'){
    getActiveCtx().beginPath();
    getActiveCtx().moveTo(sx, sy);
    getActiveCtx().lineTo(x, y);
    getActiveCtx().stroke();
    const ang = Math.atan2(y - sy, x - sx);
    const h = Math.max(8, Number(sizeEl.value)*2);
    getActiveCtx().beginPath();
    getActiveCtx().moveTo(x, y);
    getActiveCtx().lineTo(x - h * Math.cos(ang - Math.PI/6), y - h * Math.sin(ang - Math.PI/6));
    getActiveCtx().moveTo(x, y);
    getActiveCtx().lineTo(x - h * Math.cos(ang + Math.PI/6), y - h * Math.sin(ang + Math.PI/6));
    getActiveCtx().stroke();
  } else if(mode === 'line'){
    getActiveCtx().beginPath();
    getActiveCtx().moveTo(sx, sy);
    getActiveCtx().lineTo(x, y);
    getActiveCtx().stroke();
  } else if(mode === 'dblarrow'){
    drawArrowBoth(sx, sy, x, y, colorEl.value, Number(sizeEl.value));
  }

  getActiveCtx().restore();
  drawing = false;
  saveState();
}

// attach mouse + touch events
getActiveCanvas().addEventListener('mousedown', pointerStart, {passive:false});
getActiveCanvas().addEventListener('mousemove', pointerMove, {passive:false});
getActiveCanvas().addEventListener('mouseup', pointerEnd, {passive:false});
getActiveCanvas().addEventListener('mouseleave', ()=>{ if(drawing) drawing=false; }, {passive:true});

getActiveCanvas().addEventListener('touchstart', pointerStart, {passive:false});
getActiveCanvas().addEventListener('touchmove', pointerMove, {passive:false});
getActiveCanvas().addEventListener('touchend', pointerEnd, {passive:false});
getActiveCanvas().addEventListener('touchcancel', ()=>{ drawing=false; }, {passive:true});

// initial blank canvas save
saveState(true);</script>

    // for triangle we collect points: each start acts as point
    if(mode === 'triangle'){
      trianglePoints.push([p.x|0, p.y|0]);
      if(trianglePoints.length === 3){
        // draw triangle
        getActiveCtx().save();
        getActiveCtx().beginPath();
        getActiveCtx().moveTo(trianglePoints[0][0], trianglePoints[0][1]);
        getActiveCtx().lineTo(trianglePoints[1][0], trianglePoints[1][1]);
        getActiveCtx().lineTo(trianglePoints[2][0], trianglePoints[2][1]);
        getActiveCtx().closePath();
        getActiveCtx().strokeStyle = colorEl.value;
        getActiveCtx().lineWidth = Number(sizeEl.value);
        getActiveCtx().stroke();
        getActiveCtx().restore();
        trianglePoints = [];
        saveState();
      }
      return;
    }
    // otherwise start line/dblarrow
    sx = p.x; sy = p.y;
    drawing = true;
    return;
  }

  // for soft/spray, draw starts immediately
  if(mode === 'soft' || mode === 'spray'){
    drawing = true;
    // call move once to draw initial mark
    if(mode === 'soft') softStroke(p.x, p.y);
    else sprayAt(p.x, p.y);
    return;
  }

  // default (draw/erase/rect/circle/arrow)
  drawing = true;
  sx = p.x; sy = p.y;
  getActiveCtx().beginPath();
  getActiveCtx().moveTo(sx, sy);
}

function pointerMove(e){
  if(!drawing && !cropSelecting) return;
  if(e.cancelable) e.preventDefault();
  const p = extractPosFromEvent(e);
  const x = p.x, y = p.y;

  // crop preview
  if(mode === 'crop' && cropSelecting){
    cropRect.x1 = x; cropRect.y1 = y;
    // redraw last saved state then overlay rectangle
    const img = new Image();
    img.onload = ()=>{
      getActiveCtx().clearRect(0,0,getActiveCanvas().width,getActiveCanvas().height);
      getActiveCtx().drawImage(img,0,0);
      getActiveCtx().save();
      getActiveCtx().setLineDash([6,4]);
      getActiveCtx().lineWidth = 2;
      getActiveCtx().strokeStyle = 'rgba(0,0,0,0.9)';
      getActiveCtx().strokeRect(cropRect.x0, cropRect.y0, cropRect.x1 - cropRect.x0, cropRect.y1 - cropRect.y0);
      getActiveCtx().restore();
    };
    img.src = history[history.length-1];
    return;
  }

  getActiveCtx().lineWidth = Number(sizeEl.value);
  getActiveCtx().lineCap = 'round';

  if(mode === 'draw'){
    getActiveCtx().strokeStyle = colorEl.value;
    getActiveCtx().lineTo(x,y);
    getActiveCtx().stroke();
  } else if(mode === 'erase'){
    getActiveCtx().save();
    getActiveCtx().globalCompositeOperation = 'destination-out';
    getActiveCtx().lineTo(x,y);
    getActiveCtx().stroke();
    getActiveCtx().restore();
  } else if(mode === 'soft' && drawing){
    softStroke(x,y);
  } else if(mode === 'spray' && drawing){
    sprayAt(x,y);
  } else {
    // nothing on move for other tools (shapes finalize on end)
  }
}

function pointerEnd(e){
  // if crop selecting finalize
  if(cropSelecting){
    const p = extractPosFromEvent(e);
    cropRect.x1 = p.x; cropRect.y1 = p.y;
    cropSelecting = false;
    const x = Math.min(cropRect.x0, cropRect.x1)|0;
    const y = Math.min(cropRect.y0, cropRect.y1)|0;
    const w = Math.abs(cropRect.x1 - cropRect.x0)|0;
    const h = Math.abs(cropRect.y1 - cropRect.y0)|0;
    if(w>0 && h>0){
      const imgd = getActiveCtx().getImageData(x,y,w,h);
      getActiveCanvas().width = w; getActiveCanvas().height = h;
      getActiveCtx().putImageData(imgd,0,0);
      saveState();
    }
    return;
  }

  if(!drawing) return;
  const p = extractPosFromEvent(e);
  const x = p.x, y = p.y;

  getActiveCtx().save();
  getActiveCtx().strokeStyle = colorEl.value;
  getActiveCtx().lineWidth = Number(sizeEl.value);

  if(mode === 'rect'){
    getActiveCtx().strokeRect(sx, sy, x - sx, y - sy);
  } else if(mode === 'circle'){
    const r = Math.hypot(x - sx, y - sy);
    getActiveCtx().beginPath();
    getActiveCtx().arc(sx, sy, r, 0, Math.PI*2);
    getActiveCtx().stroke();
  } else if(mode === 'arrow'){
    getActiveCtx().beginPath();
    getActiveCtx().moveTo(sx, sy);
    getActiveCtx().lineTo(x, y);
    getActiveCtx().stroke();
    const ang = Math.atan2(y - sy, x - sx);
    const h = Math.max(8, Number(sizeEl.value)*2);
    getActiveCtx().beginPath();
    getActiveCtx().moveTo(x, y);
    getActiveCtx().lineTo(x - h * Math.cos(ang - Math.PI/6), y - h * Math.sin(ang - Math.PI/6));
    getActiveCtx().moveTo(x, y);
    getActiveCtx().lineTo(x - h * Math.cos(ang + Math.PI/6), y - h * Math.sin(ang + Math.PI/6));
    getActiveCtx().stroke();
  } else if(mode === 'line'){
    getActiveCtx().beginPath();
    getActiveCtx().moveTo(sx, sy);
    getActiveCtx().lineTo(x, y);
    getActiveCtx().stroke();
  } else if(mode === 'dblarrow'){
    drawArrowBoth(sx, sy, x, y, colorEl.value, Number(sizeEl.value));
  }

  getActiveCtx().restore();
  drawing = false;
  saveState();
}

// attach mouse + touch events
getActiveCanvas().addEventListener('mousedown', pointerStart, {passive:false});
getActiveCanvas().addEventListener('mousemove', pointerMove, {passive:false});
getActiveCanvas().addEventListener('mouseup', pointerEnd, {passive:false});
getActiveCanvas().addEventListener('mouseleave', ()=>{ if(drawing) drawing=false; }, {passive:true});

getActiveCanvas().addEventListener('touchstart', pointerStart, {passive:false});
getActiveCanvas().addEventListener('touchmove', pointerMove, {passive:false});
getActiveCanvas().addEventListener('touchend', pointerEnd, {passive:false});
getActiveCanvas().addEventListener('touchcancel', ()=>{ drawing=false; }, {passive:true});

// initial blank canvas save
saveState(true);</script>

<!-- Robust dynamic layers initializer (appended by assistant) -->
<script>
document.addEventListener('DOMContentLoaded', function(){
  try{
    const wrapper = document.getElementById('canvasWrapper') || document.body;
    // find existing canvases inside wrapper, prefer #c if exists
    let canvases = Array.from(wrapper.querySelectorAll('canvas'));
    let original = document.getElementById('c');
    if(original && canvases.indexOf(original) === -1){
      // ensure original is inside wrapper
      wrapper.appendChild(original);
      canvases = [original].concat(canvases.filter(c=>c!==original));
    }
    if(canvases.length === 0){
      // create one canvas if none
      const c = document.createElement('canvas');
      c.id = 'c';
      c.width = 800; c.height = 600;
      wrapper.appendChild(c);
      canvases = [c];
    }
    // make canvases positioned absolutely and stacked
    canvases.forEach((cv,i)=>{
      cv.style.position='absolute';
      cv.style.left='0';
      cv.style.top='0';
      cv.style.zIndex = i;
      cv.classList.add('layerCanvas');
    });

    window.layers = canvases.slice();
    window.activeLayer = 0;

    // attach basic listeners to forward pointer events to global handlers, if present
    function attach(cv){
      if(cv._assistant_listened) return;
      cv._assistant_listened = true;
      cv.addEventListener('mousedown', function(e){ if(typeof window.pointerStart==='function') window.pointerStart(e); }, {passive:false});
      cv.addEventListener('mousemove', function(e){ if(typeof window.pointerMove==='function') window.pointerMove(e); }, {passive:false});
      cv.addEventListener('mouseup', function(e){ if(typeof window.pointerEnd==='function') window.pointerEnd(e); }, {passive:false});
      cv.addEventListener('touchstart', function(e){ if(typeof window.pointerStart==='function') window.pointerStart(e); }, {passive:false});
      cv.addEventListener('touchmove', function(e){ if(typeof window.pointerMove==='function') window.pointerMove(e); }, {passive:false});
      cv.addEventListener('touchend', function(e){ if(typeof window.pointerEnd==='function') window.pointerEnd(e); }, {passive:false});
      cv.addEventListener('mouseleave', function(){ try{ window.drawing=false; }catch(e){} }, {passive:true});
    }
    window.layers.forEach(attach);

    // UI elements
    const listBox = document.getElementById('layersList') || document.getElementById('layersPanel') || (function(){
      const d=document.createElement('div'); d.id='layersList'; d.style.marginTop='8px'; wrapper.parentNode.insertBefore(d, wrapper.nextSibling); return d;
    })();

    function refreshUI(){
      listBox.innerHTML='';
      window.layers.forEach((cv,i)=>{
        const btn = document.createElement('button');
        btn.textContent = 'Слой ' + (i+1);
        btn.style.margin='4px';
        if(i === window.activeLayer) btn.style.background = '#6cf';
        btn.onclick = function(){ window.activeLayer = i; refreshUI(); };
        listBox.appendChild(btn);
      });
    }

    // add/del/up/down buttons (existing)
    const addBtn = document.getElementById('addLayer');
    const delBtn = document.getElementById('delLayer');
    const upBtn = document.getElementById('layerUp');
    const downBtn = document.getElementById('layerDown');

    function addLayer(){
      const base = window.layers[0] || window.layers[window.layers.length-1];
      const nc = document.createElement('canvas');
      nc.width = base.width || 800;
      nc.height = base.height || 600;
      nc.style.position='absolute'; nc.style.left='0'; nc.style.top='0';
      nc.style.zIndex = window.layers.length;
      wrapper.appendChild(nc);
      window.layers.push(nc);
      window.activeLayer = window.layers.length - 1;
      attach(nc);
      refreshUI();
    }
    function delLayer(){
      if(window.layers.length <= 1) return;
      const idx = window.activeLayer;
      const cv = window.layers[idx];
      if(cv && cv.parentNode) cv.parentNode.removeChild(cv);
      window.layers.splice(idx,1);
      if(window.activeLayer >= window.layers.length) window.activeLayer = window.layers.length-1;
      refreshUI();
    }
    function moveUp(){
      const i = window.activeLayer;
      if(i < window.layers.length - 1){
        const tmp = window.layers[i];
        window.layers[i] = window.layers[i+1];
        window.layers[i+1] = tmp;
        // reorder DOM to match new stacking
        window.layers.forEach((c,idx)=>{ c.style.zIndex = idx; wrapper.appendChild(c); });
        window.activeLayer = i+1;
        refreshUI();
      }
    }
    function moveDown(){
      const i = window.activeLayer;
      if(i > 0){
        const tmp = window.layers[i];
        window.layers[i] = window.layers[i-1];
        window.layers[i-1] = tmp;
        window.layers.forEach((c,idx)=>{ c.style.zIndex = idx; wrapper.appendChild(c); });
        window.activeLayer = i-1;
        refreshUI();
      }
    }

    if(addBtn) addBtn.addEventListener('click', addLayer);
    if(delBtn) delBtn.addEventListener('click', delLayer);
    if(upBtn) upBtn.addEventListener('click', moveUp);
    if(downBtn) downBtn.addEventListener('click', moveDown);

    // expose helper getters expected by existing code
    window.getActiveCanvas = function(){ return window.layers[window.activeLayer] || window.layers[0]; };
    window.getActiveCtx = function(){ return window.getActiveCanvas().getContext('2d'); };

    // initial UI
    refreshUI();
    console.log('Assistant layers init completed. Layers count:', window.layers.length);
  }catch(err){
    console.error('Assistant layers init error', err);
  }
});
</script>
