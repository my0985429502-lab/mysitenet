<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Saved Data</title>
</head>
<body>
  <h1>Сохранённые данные</h1>
  <pre id="out">Loading...</pre>
  <script>
    fetch('config.json')
      .then(r => r.json())
      .then(data => {
        document.getElementById('out').textContent = JSON.stringify(data, null, 2);
      })
      .catch(e => {
        document.getElementById('out').textContent = 'Error: ' + e;
      });
  </script>
</body>
</html>
