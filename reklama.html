<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разместить рекламу</title>
<link rel="stylesheet" href="ads.css">
</head>
<body>

<div class="container">

<h1>Размещение рекламы</h1>
<p>Отправьте свой рекламный баннер на наш сайт.</p>

<form id="adForm">

<label>Название компании</label>
<input id="company" required maxlength="100">

<label>Название рекламы</label>
<input id="title" required maxlength="150">

<label>Ссылка рекламодателя</label>
<input id="url" type="url" required>

<label>Описание</label>
<textarea id="description" maxlength="1000"></textarea>

<label>Рекламный баннер (до 5 МБ)</label>
<input id="banner" type="file"
accept="image/png,image/jpeg,image/gif,image/webp"
required>

<button type="submit">Отправить заявку</button>

</form>

<p id="message"></p>

<a href="index.html">Главная</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ads.js"></script>

</body>
</html>
