<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Звуковой сканер: превращение в человека</title>
  <style>
    :root {
      --bg: #08060e;
      --panel: #120e1d;
      --text: #f3e8ff;
      --muted: #a799c2;
      --ghost: #a855f7;
      --human: #38bdf8;
      --ok: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #221238 0%, var(--bg) 72%);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.35s ease;
    }

    body.is-human {
      background: radial-gradient(circle at top, #0d273b 0%, #060b12 75%);
    }

    .app {
      width: 100%;
      max-width: 440px;
      background: rgba(18, 14, 29, 0.92);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      transition: border-color 0.35s ease;
    }

    body.is-human .app {
      border-color: rgba(56, 189, 248, 0.35);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .badge {
      font-size: 0.76rem;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(168, 85, 247, 0.18);
      color: #e9d5ff;
      border: 1px solid rgba(168, 85, 247, 0.4);
      font-weight: 700;
      white-space: nowrap;
    }

    body.is-human .badge {
      background: rgba(56, 189, 248, 0.18);
      color: #bae6fd;
      border-color: rgba(56, 189, 248, 0.45);
    }

    .radar-wrap {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 14px auto 20px;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, rgba(168, 85, 247, 0.02) 65%, transparent 72%),
        repeating-radial-gradient(circle, rgba(168, 85, 247, 0.16) 0 1px, transparent 1px 40px);
      border: 1px solid rgba(168, 85, 247, 0.3);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.35s ease;
    }

    body.is-human .radar-wrap {
      background:
        radial-gradient(circle, rgba(56, 189, 248, 0.14) 0%, rgba(56, 189, 248, 0.02) 65%, transparent 72%),
        repeating-radial-gradient(circle, rgba(56, 189, 248, 0.16) 0 1px, transparent 1px 40px);
      border-color: rgba(56, 189, 248, 0.45);
      box-shadow: 0 0 28px rgba(56, 189, 248, 0.22);
    }

    .sweep {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(56, 189, 248, 0.42) 0deg,
        rgba(56, 189, 248, 0.06) 55deg,
        transparent 65deg
      );
      animation: spin 3.2s linear infinite;
      opacity: 0.35;
    }

    .radar-wrap.scanning .sweep {
      opacity: 1;
      animation-duration: 1.1s;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .entity-icon {
      position: relative;
      z-index: 2;
      font-size: 3.1rem;
      filter: drop-shadow(0 0 14px rgba(168, 85, 247, 0.7));
      transition: transform 0.25s ease;
    }

    body.is-human .entity-icon {
      transform: scale(1.1);
      filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.75));
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .status-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 16px;
      display: grid;
      gap: 6px;
      font-size: 0.9rem;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .muted { color: var(--muted); }
    .val-ghost { color: #d8b4fe; font-weight: 700; }
    .val-human { color: #7dd3fc; font-weight: 700; }
    .val-ok { color: var(--ok); font-weight: 600; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 14px;
      font-size: 0.94rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.2s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-scan {
      grid-column: 1 / -1;
      background: var(--human);
      color: #04131d;
    }

    .btn-ghost {
      background: rgba(168, 85, 247, 0.22);
      color: #f3e8ff;
      border: 1px solid rgba(168, 85, 247, 0.45);
    }

    .btn-ping {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .duration-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.88rem;
      color: var(--muted);
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--human);
    }

    .log {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--muted);
      max-height: 82px;
      overflow-y: auto;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 10px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title">Звуковой сканер</div>
      <div class="badge" id="modeBadge">ПРИЗРАК 👻</div>
    </div>

    <div class="radar-wrap" id="radar">
      <div class="sweep"></div>
      <canvas id="waveCanvas" width="240" height="240"></canvas>
      <div class="entity-icon" id="entityIcon">👻</div>
    </div>

    <div class="status-box">
      <div class="status-row">
        <span class="muted">Кто ты сейчас:</span>
        <span id="formText" class="val-ghost">Призрак</span>
      </div>
      <div class="status-row">
        <span class="muted">Звуковой сигнал:</span>
        <span id="audioText" class="val-ok">Активен</span>
      </div>
      <div class="status-row">
        <span class="muted">Частота сканера:</span>
        <span id="freqText" class="muted">0 Гц</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn-scan" id="scanBtn">📡 Звуковой скан → стать человеком</button>
      <button class="btn-ping" id="pingBtn">🔊 Звуковой импульс</button>
      <button class="btn-ghost" id="backGhostBtn">👻 Снова в призрака</button>
    </div>

    <div class="duration-row">
      <label for="humanDuration">Быть человеком:</label>
      <input type="range" id="humanDuration" min="2" max="15" value="6" />
      <span id="durationLabel">6 сек</span>
    </div>

    <div class="log" id="log">Ты призрак. Запусти звуковой скан, чтобы звук вернул тебя в человека (без фото и камеры).</div>
  </div>

  <script>
    let audioCtx = null;
    let masterGain = null;

    const state = {
      isHuman: false,
      isScanning: false,
      humanRemaining: 0,
      currentFreq: 0,
      humanTimer: null,
      countdownTimer: null
    };

    const els = {
      radar: document.getElementById('radar'),
      waveCanvas: document.getElementById('waveCanvas'),
      entityIcon: document.getElementById('entityIcon'),
      modeBadge: document.getElementById('modeBadge'),
      formText: document.getElementById('formText'),
      audioText: document.getElementById('audioText'),
      freqText: document.getElementById('freqText'),
      scanBtn: document.getElementById('scanBtn'),
      pingBtn: document.getElementById('pingBtn'),
      backGhostBtn: document.getElementById('backGhostBtn'),
      humanDuration: document.getElementById('humanDuration'),
      durationLabel: document.getElementById('durationLabel'),
      log: document.getElementById('log')
    };

    const ctx2d = els.waveCanvas.getContext('2d');

    function writeLog(text) {
      const time = new Date().toLocaleTimeString('ru-RU', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      els.log.innerHTML = `<div>[${time}] ${text}</div>` + els.log.innerHTML;
    }

    function ensureAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq = 520, duration = 0.14, type = 'sine') {
      ensureAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const env = audioCtx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);

      env.gain.setValueAtTime(0.001, now);
      env.gain.exponentialRampToValueAtTime(0.65, now + 0.015);
      env.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.connect(env);
      env.connect(masterGain);

      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    // Звуковой аккорд превращения в человека
    function playHumanizeSound() {
      playTone(330, 0.14, 'triangle');
      setTimeout(() => playTone(440, 0.14, 'triangle'), 90);
      setTimeout(() => playTone(587, 0.22, 'sine'), 180);
    }

    // Звук возврата в призрака
    function playGhostifySound() {
      playTone(440, 0.14, 'sine');
      setTimeout(() => playTone(290, 0.2, 'sine'), 110);
    }

    function renderUI() {
      document.body.classList.toggle('is-human', state.isHuman);
      els.radar.classList.toggle('scanning', state.isScanning);

      if (state.isHuman) {
        els.modeBadge.textContent = 'ЧЕЛОВЕК 🧑';
        els.entityIcon.textContent = '🧑';
        els.formText.textContent = state.humanRemaining > 0
          ? `Человек (${state.humanRemaining} сек)`
          : 'Человек';
        els.formText.className = 'val-human';
      } else {
        els.modeBadge.textContent = 'ПРИЗРАК 👻';
        els.entityIcon.textContent = '👻';
        els.formText.textContent = 'Призрак';
        els.formText.className = 'val-ghost';
      }

      els.audioText.textContent = state.isScanning ? 'Сканирование...' : 'Активен (100%)';
      els.audioText.className = 'val-ok';
      els.freqText.textContent = state.currentFreq > 0 ? `${Math.round(state.currentFreq)} Гц` : '0 Гц';
    }

    function turnIntoGhost(silent = false) {
      clearTimeout(state.humanTimer);
      clearInterval(state.countdownTimer);
      state.isHuman = false;
      state.humanRemaining = 0;
      renderUI();
      if (!silent) {
        playGhostifySound();
        writeLog('Ты снова стал призраком 👻.');
      }
    }

    function turnIntoHuman(seconds) {
      ensureAudio();
      clearTimeout(state.humanTimer);
      clearInterval(state.countdownTimer);

      state.isHuman = true;
      state.humanRemaining = seconds;
      playHumanizeSound();
      renderUI();
      writeLog(`Звук превратил тебя в человека 🧑 на ${seconds} сек!`);

      state.countdownTimer = setInterval(() => {
        state.humanRemaining = Math.max(0, state.humanRemaining - 1);
        renderUI();
        if (state.humanRemaining <= 0) {
          clearInterval(state.countdownTimer);
        }
      }, 1000);

      state.humanTimer = setTimeout(() => {
        turnIntoGhost(false);
      }, seconds * 1000);
    }

    function runSoundScanner() {
      ensureAudio();
      if (state.isScanning) return;

      state.isScanning = true;
      renderUI();
      writeLog('Звуковой сканер запущен (без фото)...');

      let step = 0;
      const steps = 8;
      const interval = setInterval(() => {
        step += 1;
        const freq = 300 + step * 55 + Math.random() * 90;
        state.currentFreq = freq;
        playTone(freq, 0.11, 'sine');
        renderUI();

        if (step >= steps) {
          clearInterval(interval);
          state.isScanning = false;
          state.currentFreq = 0;
          renderUI();
          turnIntoHuman(Number(els.humanDuration.value));
        }
      }, 150);
    }

    let phase = 0;
    function drawWave() {
      const { width, height } = els.waveCanvas;
      ctx2d.clearRect(0, 0, width, height);

      const midY = height / 2;
      ctx2d.beginPath();

      const amp = state.isScanning ? 26 : (state.isHuman ? 14 : 9);
      const speed = state.isScanning ? 0.18 : 0.07;
      phase += speed;

      for (let x = 20; x <= width - 20; x += 3) {
        const norm = (x - 20) / (width - 40);
        const env = Math.sin(norm * Math.PI);
        const y = midY + Math.sin(x * 0.08 + phase) * amp * env;
        if (x === 20) ctx2d.moveTo(x, y);
        else ctx2d.lineTo(x, y);
      }

      ctx2d.strokeStyle = state.isHuman
        ? 'rgba(56, 189, 248, 0.9)'
        : 'rgba(216, 180, 254, 0.75)';
      ctx2d.lineWidth = 2.5;
      ctx2d.stroke();

      requestAnimationFrame(drawWave);
    }

    els.humanDuration.addEventListener('input', () => {
      els.durationLabel.textContent = `${els.humanDuration.value} сек`;
    });

    els.scanBtn.addEventListener('click', runSoundScanner);

    els.pingBtn.addEventListener('click', () => {
      ensureAudio();
      playTone(523, 0.16, 'triangle');
      writeLog('Прозвучал звуковой импульс (523 Гц).');
    });

    els.backGhostBtn.addEventListener('click', () => {
      turnIntoGhost(false);
    });

    renderUI();
    drawWave();
  </script>
</body>
</html>
