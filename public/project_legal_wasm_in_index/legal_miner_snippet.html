<!-- Consent-first miner snippet (paste into your page where you want the UI) -->
<div id="legal-miner">
  <label><input type="checkbox" id="miner-consent"> I consent to run CPU hashing in my browser.</label>
  <div>
    <input id="miner-message" value="Legal miner demo" />
    <input id="miner-target" value="00000" style="width:120px" />
    <button id="miner-start" disabled>Start Mining</button>
    <button id="miner-stop" disabled>Stop</button>
  </div>
  <div>Hashrate: <span id="miner-hashrate">0</span> H/s | Tried: <span id="miner-tried">0</span></div>
</div>
<script type="module">
  import { startMining } from '/public/miner_module.js';
  let minerHandle = null;
  let lastTotal = 0;
  let lastTime = performance.now();

  const consent = document.getElementById('miner-consent');
  const startBtn = document.getElementById('miner-start');
  const stopBtn = document.getElementById('miner-stop');
  const messageEl = document.getElementById('miner-message');
  const targetEl = document.getElementById('miner-target');
  const hashrateEl = document.getElementById('miner-hashrate');
  const triedEl = document.getElementById('miner-tried');

  consent.addEventListener('change', ()=>{ startBtn.disabled = !consent.checked; });

  startBtn.addEventListener('click', async ()=>{
    startBtn.disabled = true; stopBtn.disabled = false;
    minerHandle = await startMining({
      message: messageEl.value,
      target: targetEl.value,
      onProgress: ({hash, nonce, total, found, nonceHex})=>{
        triedEl.textContent = total || triedEl.textContent;
        const now = performance.now();
        const elapsed = (now - lastTime)/1000;
        if(elapsed >= 1.0){
          const diff = (total || 0) - lastTotal;
          hashrateEl.textContent = Math.round(diff/elapsed);
          lastTime = now; lastTotal = total || lastTotal;
        }
        if(found){
          alert('Nonce found: '+nonceHex+' hash: '+hash);
        }
      }
    });
  });

  stopBtn.addEventListener('click', ()=>{
    if(minerHandle) minerHandle.stop();
    startBtn.disabled = false; stopBtn.disabled = true;
  });
</script>
<!-- End snippet -->
