<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>WebVM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>
<body>
<div id="root"></div>

<script>
const { useState, useEffect } = React;

function App() {
  const wallpapers = {
    default: 'linear-gradient(135deg,#0f172a,#0ea5e9)',
    sunset: 'linear-gradient(135deg,#f97316,#ec4899)',
    matrix: 'radial-gradient(circle at center, #16a34a 0%, #020617 70%)',
    space: 'linear-gradient(135deg,#020617,#312e81)'
  };

  const [powered, setPowered] = useState(false);
  const [wallpaper, setWallpaper] = useState(wallpapers.default);

  return (
    React.createElement("div", {
      className: "w-full h-screen flex items-center justify-center text-white",
      style: { background: wallpaper }
    },
      powered ?
        React.createElement("div", { className: "text-center space-y-4" },
          React.createElement("h1", { className: "text-3xl font-bold" }, "WebVM"),
          React.createElement("div", { className: "space-x-2" },
            Object.keys(wallpapers).map(w =>
              React.createElement("button", {
                key: w,
                onClick: () => setWallpaper(wallpapers[w]),
                className: "px-3 py-1 bg-black/40 rounded"
              }, w)
            )
          ),
          React.createElement("button", {
            onClick: () => setPowered(false),
            className: "px-6 py-2 bg-red-600 rounded"
          }, "Выключить")
        )
      :
        React.createElement("button", {
          onClick: () => setPowered(true),
          className: "px-6 py-2 bg-sky-500 rounded"
        }, "Включить WebVM")
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>

</body>
</html>
