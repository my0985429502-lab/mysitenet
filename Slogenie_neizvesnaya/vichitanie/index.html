<div class="box">
  <h2>Вычитание неизвестной X</h2>
  <p>Введи уравнение, например: x - 5 = 12</p>

  <input id="equation" value="x - 5 = 12"
         placeholder="Введите уравнение">

  <button onclick="calculate()">Вычислить X</button>
  <div id="result"></div>
</div>
<div class="card" width="15%">
    <h2>Просмотры страницы</h2>
    <div id="visit-count" class="counter-display">0</div>
</div>
<script>
    // 1. Получаем элементы со страницы
    const counterDisplay = document.getElementById('visit-count');
    const resetButton = document.getElementById('reset-btn');

    // 2. Считываем сохраненное количество посещений
    let visits = localStorage.getItem('page_visit_count');

    // Если сохраненного значения нет — инициализируем нулем
    if (visits === null) {
      visits = 0;
    }

    // 3. Увеличиваем на 1 текущий визит
    visits = parseInt(visits) + 1;

    // 4. Сохраняем новое значение обратно в localStorage
    localStorage.setItem('page_visit_count', visits);

    // 5. Выводим значение на страницу
    counterDisplay.textContent = visits;
</script>
<script>
function calculate() {
  const text = document.getElementById("equation").value
    .toLowerCase().replace(/\s+/g, "").replace(/,/g, ".");

  const result = document.getElementById("result");
  const parts = text.split("=");

  if (parts.length !== 2 || !text.includes("x")) {
    result.textContent = "Введите уравнение, например x - 5 = 12";
    return;
  }

  function parseSide(s) {
    const terms = s.match(/[+-]?[^+-]+/g);
    if (!terms) throw Error();

    let a = 0, b = 0;

    for (let term of terms) {
      if (term.includes("x")) {
        let k = term.replace("x", "");
        if (k === "" || k === "+") k = "1";
        if (k === "-") k = "-1";
        a += Number(k);
      } else {
        b += Number(term);
      }
    }
    return [a, b];
  }

  try {
    if (!/^[0-9.x+\-=]+$/.test(text)) throw Error();

    const [a1, b1] = parseSide(parts[0]);
    const [a2, b2] = parseSide(parts[1]);

    const coefficient = a1 - a2;
    const constant = b2 - b1;

    if (coefficient === 0) {
      result.textContent = constant === 0
        ? "Бесконечно много решений"
        : "Решений нет";
      return;
    }

    const x = constant / coefficient;

    result.textContent = "Ответ: x = " +
      (Number.isInteger(x) ? x : Number(x.toFixed(8)));
  } catch {
    result.textContent = "Ошибка ввода. Проверь уравнение.";
  }
}
</script>
