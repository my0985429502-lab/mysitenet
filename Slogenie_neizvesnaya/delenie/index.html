<script>
function calculate() {
  const text = document.getElementById("equation").value
    .toLowerCase()
    .replace(/\s+/g, "")
    .replace(/,/g, ".")
    .replace(/÷/g, "/");

  const result = document.getElementById("result");
  const parts = text.split("=");

  try {
    if (parts.length !== 2 || !text.includes("x"))
      throw Error();

    // Разбор чисел и неизвестной
    function parse(s) {
      let terms = s.split("/");
      if (terms.length > 2) throw Error();

      function factor(t) {
        if (t === "x") return {a: 1, b: 0};
        if (/^[+-]?(?:\d+\.?\d*|\.\d+)$/.test(t))
          return {a: 0, b: Number(t)};
        throw Error();
      }

      let first = factor(terms[0]);

      if (terms.length === 1) return first;

      let second = factor(terms[1]);

      // Деление двух выражений с x не поддерживается
      if (second.a !== 0 || second.b === 0) throw Error();

      return {
        a: first.a / second.b,
        b: first.b / second.b
      };
    }

    if (!/^[0-9.x+\-\/=]+$/.test(text)) throw Error();

    let left = parse(parts[0]);
    let right = parse(parts[1]);

    let a = left.a - right.a;
    let b = right.b - left.b;

    if (a === 0) {
      result.textContent = b === 0
        ? "Бесконечно много решений"
        : "Решений нет";
      return;
    }

    let x = b / a;

    result.textContent = "Ответ: x = " +
      (Number.isInteger(x) ? x : Number(x.toFixed(8)));

  } catch {
    result.textContent = "Ошибка. Используй формат x/5=4 или 20/x=4";
  }
}
